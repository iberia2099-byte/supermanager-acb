<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>SuperManager ACB</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub{opacity:.7;font-size:13px}
main{max-width:650px;margin:auto;padding:14px 14px 80px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:13px;padding:13px 16px;font-weight:750;font-size:15px;background:#111827;color:#fff;width:100%;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f9fafb;border-radius:13px;padding:12px}.label{font-size:12px;color:#6b7280}.value{font-weight:750;margin-top:4px}
.player{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;gap:10px}.player:last-child{border:0}.name{font-weight:650}.meta{font-size:12px;color:#6b7280}.price{font-weight:700;white-space:nowrap}
.player.baja{opacity:.55}
.status{padding:6px 9px;border-radius:99px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}
.error{background:#fee2e2;color:#991b1b}.muted{color:#6b7280;font-size:12px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bajabtn{border:1px solid #d1d5db;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;background:#fff;color:#6b7280;width:auto;margin:0}
.bajabtn.on{background:#fee2e2;color:#991b1b;border-color:#fecaca}
</style></head><body>
<header><h1>🏀 SuperManager ACB</h1><div class="sub">Jornada <span id="j">-</span> · <span id="n">-</span> jugadores</div></header>
<main>
<div class="card"><div style="display:flex;justify-content:space-between"><b>Datos del mercado</b><span id="st" class="status">LISTO</span></div>
<button onclick="refresh()">🔄 Actualizar mercado real</button><div id="msg" class="muted" style="margin-top:10px">Pulsa actualizar para consultar El Rincón desde el servidor.</div></div>
<div class="card"><b>📊 Mercado actual</b><div id="list" style="margin-top:8px"><div class="muted">Sin datos cargados.</div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function load(){
 try{const r=await fetch('/api/players');const d=await r.json();render(d)}
 catch(e){$('msg').textContent='No se pudo conectar con el servidor.'}
}
function render(d){
 $('j').textContent=d.jornada??'-';$('n').textContent=d.players.length;
 $('list').innerHTML=d.players.slice(0,30).map(p=>{
   const baja = !!p.de_baja;
   const key = esc(p.name)+'|'+esc(p.team||'');
   return `<div class="player ${baja?'baja':''}">
     <div><div class="name">${esc(p.name)}</div><div class="meta">${p.position} · ${esc(p.team||'')} · +15 ${p.sm_plus15??'-'}${p.valoracion_media!=null?(' · media '+p.valoracion_media):''}</div></div>
     <div class="right">
       <div class="price">${p.price?.toLocaleString('es-ES')??'-'} €</div>
       <button class="bajabtn ${baja?'on':''}" onclick="toggleBaja('${escJs(p.name)}','${escJs(p.team||'')}',${baja?'false':'true'})">${baja?'BAJA ✕':'Marcar baja'}</button>
     </div>
   </div>`;
 }).join('');
}
async function toggleBaja(name,team,nuevoValor){
 try{
   await fetch('/api/bajas',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({name,team,baja:nuevoValor})});
   load();
 }catch(e){alert('No se pudo actualizar la baja: '+e.message)}
}
async function refresh(){
 $('st').textContent='ACTUALIZANDO';$('st').className='status';$('msg').textContent='Consultando Broker + Valoración + Calendario...';
 try{
   const r=await fetch('/api/refresh_all',{method:'POST'});const d=await r.json();if(!r.ok)throw Error(d.detail||'Error');
   await load();
   $('st').textContent='ACTUAL';
   const b=d.broker?`Broker: ${d.broker.players} jugadores (J${d.broker.jornada}).`:'';
   const v=d.valoracion?` Valoración: ${d.valoracion.players} filas OK.`:d.valoracion_error?` Valoración: ERROR — ${d.valoracion_error}`:'';
   const c=d.calendario?` Calendario: ${d.calendario.fixtures} partidos OK.`:d.calendario_error?` Calendario: ERROR — ${d.calendario_error}`:'';
   $('msg').textContent=b+v+c;
 }catch(e){$('st').textContent='ERROR';$('st').className='status error';$('msg').textContent=e.message}
}
function esc(x){return String(x).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function escJs(x){return String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
load();
</script></body></html>
